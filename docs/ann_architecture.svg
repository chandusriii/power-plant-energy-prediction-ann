<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2000 1400" width="2000" height="1400" role="img" aria-labelledby="title desc">
<title id="title">Power Plant Energy Prediction ANN — large detailed architecture and learning flow</title>
<desc id="desc">Large-format neural network diagram showing the four input features, hidden layers, regression output, neuron calculations, MSE loss, backpropagation and Adam updates.</desc>
<g transform="scale(1.25)">

<title id="title">Power Plant Energy Prediction ANN — detailed architecture and learning flow</title>
<desc id="desc">A fully connected feed-forward neural network with four standardized inputs, two six-neuron ReLU hidden layers, one linear output for predicted PE, mean squared error loss, and a backpropagation and Adam update loop.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b1424"/><stop offset="1" stop-color="#152943"/></linearGradient>
  <linearGradient id="layer" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1f4664"/><stop offset="1" stop-color="#20324e"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#9eb4d0"/></marker>
  <marker id="goldArrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#f6c85f"/></marker>
  <style>
    .title{font:700 34px Arial,sans-serif;fill:#f3f7ff}.subtitle{font:18px Arial,sans-serif;fill:#b8c8dd}
    .section{font:700 19px Arial,sans-serif;fill:#eaf1fb;letter-spacing:1px}
    .nodeText{font:700 16px Arial,sans-serif;fill:#f8fbff;text-anchor:middle;dominant-baseline:middle}
    .inputText{font:700 17px Arial,sans-serif;fill:#eaf5ff;text-anchor:middle;dominant-baseline:middle}
    .muted{font:16px Arial,sans-serif;fill:#bac9dc}.small{font:14px Arial,sans-serif;fill:#aebfd4}
    .eq{font:18px 'Courier New',monospace;fill:#f6d98a}.box{fill:#14243a;stroke:#3c5775;stroke-width:2}
    .edge{stroke:#9eb4d0;stroke-opacity:.3;stroke-width:2;fill:none}
    .forward{stroke:#72c7ef;stroke-width:3;fill:none;marker-end:url(#arrow)}
    .backward{stroke:#f6c85f;stroke-width:3;fill:none;stroke-dasharray:9 7;marker-end:url(#goldArrow)}
    .input{fill:#245478;stroke:#8ad0f4;stroke-width:3}.hidden{fill:#245a53;stroke:#7cd9b6;stroke-width:3}
    .output{fill:#684d20;stroke:#f6c85f;stroke-width:3}
    .pill{fill:#203650;stroke:#496989;stroke-width:1.5}
  </style>
</defs>
<rect width="1600" height="1120" rx="28" fill="url(#background)"/>
<text x="65" y="66" class="title">POWER PLANT ENERGY PREDICTION — ARTIFICIAL NEURAL NETWORK</text>
<text x="65" y="102" class="subtitle">Implemented PyTorch model · Fully connected feed-forward regression · Architecture: 4 → 6 → 6 → 1</text>

<!-- Architecture panel -->
<rect x="45" y="135" width="1510" height="570" rx="22" class="box" filter="url(#shadow)"/>
<text x="80" y="180" class="section">1 · NETWORK ARCHITECTURE</text>
<text x="80" y="212" class="muted">Every neuron in one layer connects to every neuron in the next layer (dense / fully connected layers).</text>

<!-- Layer labels -->
<g text-anchor="middle">
 <text x="175" y="265" class="section">INPUT</text><text x="175" y="290" class="small">4 features</text>
 <text x="570" y="265" class="section">HIDDEN LAYER 1</text><text x="570" y="290" class="small">6 neurons · ReLU</text>
 <text x="970" y="265" class="section">HIDDEN LAYER 2</text><text x="970" y="290" class="small">6 neurons · ReLU</text>
 <text x="1370" y="265" class="section">OUTPUT</text><text x="1370" y="290" class="small">1 neuron · Linear</text>
</g>

<!-- Fully connected edges (4x6, 6x6, 6x1) -->
<g class="edge">
<path d="M205 340 L535 325"/><path d="M205 340 L535 390"/><path d="M205 340 L535 455"/><path d="M205 340 L535 520"/><path d="M205 340 L535 585"/><path d="M205 340 L535 650"/><path d="M205 445 L535 325"/><path d="M205 445 L535 390"/><path d="M205 445 L535 455"/><path d="M205 445 L535 520"/><path d="M205 445 L535 585"/><path d="M205 445 L535 650"/><path d="M205 550 L535 325"/><path d="M205 550 L535 390"/><path d="M205 550 L535 455"/><path d="M205 550 L535 520"/><path d="M205 550 L535 585"/><path d="M205 550 L535 650"/><path d="M205 655 L535 325"/><path d="M205 655 L535 390"/><path d="M205 655 L535 455"/><path d="M205 655 L535 520"/><path d="M205 655 L535 585"/><path d="M205 655 L535 650"/>
<path d="M600 325 L935 325"/><path d="M600 325 L935 390"/><path d="M600 325 L935 455"/><path d="M600 325 L935 520"/><path d="M600 325 L935 585"/><path d="M600 325 L935 650"/><path d="M600 390 L935 325"/><path d="M600 390 L935 390"/><path d="M600 390 L935 455"/><path d="M600 390 L935 520"/><path d="M600 390 L935 585"/><path d="M600 390 L935 650"/><path d="M600 455 L935 325"/><path d="M600 455 L935 390"/><path d="M600 455 L935 455"/><path d="M600 455 L935 520"/><path d="M600 455 L935 585"/><path d="M600 455 L935 650"/><path d="M600 520 L935 325"/><path d="M600 520 L935 390"/><path d="M600 520 L935 455"/><path d="M600 520 L935 520"/><path d="M600 520 L935 585"/><path d="M600 520 L935 650"/><path d="M600 585 L935 325"/><path d="M600 585 L935 390"/><path d="M600 585 L935 455"/><path d="M600 585 L935 520"/><path d="M600 585 L935 585"/><path d="M600 585 L935 650"/><path d="M600 650 L935 325"/><path d="M600 650 L935 390"/><path d="M600 650 L935 455"/><path d="M600 650 L935 520"/><path d="M600 650 L935 585"/><path d="M600 650 L935 650"/>
<path d="M1000 325 L1330 485"/><path d="M1000 390 L1330 485"/><path d="M1000 455 L1330 485"/><path d="M1000 520 L1330 485"/><path d="M1000 585 L1330 485"/><path d="M1000 650 L1330 485"/>
</g>

<!-- Inputs -->
<circle cx="175" cy="340" r="29" class="input"/><text x="175" y="340" class="inputText">AT</text><text x="225" y="346" class="small">Ambient temperature</text><circle cx="175" cy="445" r="29" class="input"/><text x="175" y="445" class="inputText">V</text><text x="225" y="451" class="small">Exhaust vacuum</text><circle cx="175" cy="550" r="29" class="input"/><text x="175" y="550" class="inputText">AP</text><text x="225" y="556" class="small">Ambient pressure</text><circle cx="175" cy="655" r="29" class="input"/><text x="175" y="655" class="inputText">RH</text><text x="225" y="661" class="small">Relative humidity</text>

<!-- Hidden layer 1 -->
<circle cx="570" cy="325" r="25" class="hidden"/><text x="570" y="325" class="nodeText">h1</text><circle cx="570" cy="390" r="25" class="hidden"/><text x="570" y="390" class="nodeText">h2</text><circle cx="570" cy="455" r="25" class="hidden"/><text x="570" y="455" class="nodeText">h3</text><circle cx="570" cy="520" r="25" class="hidden"/><text x="570" y="520" class="nodeText">h4</text><circle cx="570" cy="585" r="25" class="hidden"/><text x="570" y="585" class="nodeText">h5</text><circle cx="570" cy="650" r="25" class="hidden"/><text x="570" y="650" class="nodeText">h6</text>
<!-- Hidden layer 2 -->
<circle cx="970" cy="325" r="25" class="hidden"/><text x="970" y="325" class="nodeText">h1</text><circle cx="970" cy="390" r="25" class="hidden"/><text x="970" y="390" class="nodeText">h2</text><circle cx="970" cy="455" r="25" class="hidden"/><text x="970" y="455" class="nodeText">h3</text><circle cx="970" cy="520" r="25" class="hidden"/><text x="970" y="520" class="nodeText">h4</text><circle cx="970" cy="585" r="25" class="hidden"/><text x="970" y="585" class="nodeText">h5</text><circle cx="970" cy="650" r="25" class="hidden"/><text x="970" y="650" class="nodeText">h6</text>
<!-- Output -->
<circle cx="1370" cy="485" r="43" class="output"/><text x="1370" y="485" class="nodeText">PE</text>
<text x="1370" y="545" class="small" text-anchor="middle">Predicted output</text>

<!-- layer dimension footers -->
<g text-anchor="middle">
 <rect x="105" y="665" width="140" height="26" rx="13" class="pill"/><text x="175" y="684" class="small">4 inputs</text>
 <rect x="495" y="665" width="150" height="26" rx="13" class="pill"/><text x="570" y="684" class="small">6 × 1 neurons</text>
 <rect x="895" y="665" width="150" height="26" rx="13" class="pill"/><text x="970" y="684" class="small">6 × 1 neurons</text>
 <rect x="1300" y="665" width="140" height="26" rx="13" class="pill"/><text x="1370" y="684" class="small">1 prediction</text>
</g>

<!-- Computation details -->
<rect x="45" y="730" width="735" height="325" rx="22" class="box"/>
<text x="80" y="775" class="section">2 · WHAT HAPPENS INSIDE EACH LAYER?</text>
<text x="80" y="818" class="eq">z = W x + b</text>
<text x="285" y="818" class="muted">Weighted sum + bias</text>
<text x="80" y="858" class="eq">a = ReLU(z) = max(0, z)</text>
<text x="80" y="893" class="muted">Applied in both hidden layers to learn non-linear relationships.</text>
<text x="80" y="941" class="eq">ŷ = W₃ a₂ + b₃</text>
<text x="285" y="941" class="muted">Final linear output; no activation function.</text>
<text x="80" y="992" class="small">W = trainable weights · b = trainable bias · x = input / previous activations</text>

<rect x="805" y="730" width="750" height="325" rx="22" class="box"/>
<text x="840" y="775" class="section">3 · TRAINING: FORWARD + BACKWARD PASS</text>
<rect x="845" y="805" width="300" height="62" rx="12" class="pill"/><text x="995" y="830" class="nodeText">Forward propagation</text><text x="995" y="852" class="small" text-anchor="middle">Inputs → hidden layers → prediction</text>
<path d="M1145 836 H1210" class="forward"/>
<rect x="1218" y="805" width="290" height="62" rx="12" class="pill"/><text x="1363" y="830" class="nodeText">Loss calculation</text><text x="1363" y="852" class="small" text-anchor="middle">MSE(prediction, target)</text>
<path d="M1363 872 V915 H995 V880" class="backward"/>
<text x="1177" y="908" class="small" text-anchor="middle">Backpropagation: gradients flow backward</text>
<rect x="845" y="930" width="300" height="62" rx="12" class="pill"/><text x="995" y="955" class="nodeText">Adam optimizer</text><text x="995" y="977" class="small" text-anchor="middle">Updates weights and biases</text>
<path d="M995 930 V885" class="backward"/>
<text x="1190" y="969" class="muted">Repeat for mini-batches and epochs</text>
<text x="840" y="1030" class="small">Training objective: minimize Mean Squared Error (MSE).</text>

</g>
</svg>